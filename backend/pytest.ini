[pytest]
# Configuração do pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de execução
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Marcadores personalizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração
    auth: Testes de autenticação
    providers: Testes de prestadores
    categories: Testes de categorias
    reviews: Testes de avaliações
    favorites: Testes de favoritos
    tickets: Testes de tickets
    slow: Testes lentos

# Configuração de asyncio
asyncio_mode = auto

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning